services:
  # Serwer WWW Nginx (E)
  nginx:
    image: nginx:1.25.4-alpine
    container_name: lemp_nginx
    restart: always
    ports:
      - "4001:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - php

  # Serwer PHP-FPM (P)
  php:
    image: php:8.2-fpm
    container_name: lemp_php
    restart: always
    volumes:
      - ./src:/var/www/html:ro
    networks:
      - backend
    command: sh -c "docker-php-ext-install mysqli && docker-php-ext-enable mysqli && php-fpm"

  # Serwer bazy danych MySQL (M)
  mysql:
    image: mysql:8.0.36
    container_name: lemp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test_db
    networks:
      - backend

  # Interfejs phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: lemp_phpmyadmin
    restart: always
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - frontend
      - backend
    depends_on:
      - mysql

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge